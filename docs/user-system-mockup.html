  .rank { display: flex; align-items: center; margin-bottom: 10px; }
  .badge { width: 22px; height: 22px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; margin-right: 10px; }
  .rname { width: 82px; font-size: 12px; font-weight: 600; }
